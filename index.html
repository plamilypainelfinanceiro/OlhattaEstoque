<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olhatta • Controle de Estoque</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5C7A58">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#FAF7F1;
  --surface:#FFFFFF;
  --surface-2:#F3EEE5;
  --primary:#75946F;
  --primary-dark:#546E50;
  --primary-light:#E6EDE3;
  --secondary:#9C7A54;
  --secondary-light:#F1E6D6;
  --text:#332E27;
  --text-muted:#8A8072;
  --border:#E7DFD2;
  --danger:#BD5B4F;
  --danger-light:#F7E5E1;
  --warning:#C99341;
  --warning-light:#FAF0DC;
  --success:#5C8A58;
  --success-light:#E7F0E4;
  --radius:14px;
  --shadow:0 1px 2px rgba(51,46,39,.04), 0 6px 20px rgba(51,46,39,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--primary-light);}

/* ---------- layout ---------- */
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ---------- login ---------- */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px; background:
    radial-gradient(circle at 15% 15%, var(--primary-light) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, var(--secondary-light) 0%, transparent 45%),
    var(--bg);
}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  box-shadow:var(--shadow); padding:40px 36px; width:100%; max-width:400px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.brand-mark{width:42px;height:42px;flex-shrink:0;}
.brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:.2px;}
.brand-sub{font-size:11.5px;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin-top:1px;}
.login-title{font-size:20px;font-weight:600;margin:0 0 4px;}
.login-desc{font-size:13.5px;color:var(--text-muted);margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;
}
.field input:focus, .field select:focus{border-color:var(--primary);background:var(--surface);}
.btn{
  border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s, transform .1s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:var(--secondary-light);color:var(--secondary);}
.btn-secondary:hover{filter:brightness(0.97);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:var(--danger-light);color:var(--danger);}
.btn-danger-solid{background:var(--danger);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-ghost{background:transparent;color:var(--text-muted);border:none;}
.btn-ghost:hover{color:var(--text);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.divider-row{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--text-muted);font-size:12px;}
.divider-row .line{flex:1;height:1px;background:var(--border);}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;width:100%;color:var(--text);}
.google-btn:hover{border-color:var(--text-muted);}
.login-footer{margin-top:20px;text-align:center;font-size:12.5px;color:var(--text-muted);}
.login-footer a{color:var(--secondary);text-decoration:none;font-weight:600;}
.login-switch{text-align:center;font-size:13px;margin-top:16px;color:var(--text-muted);}
.login-switch a{color:var(--primary-dark);font-weight:600;text-decoration:none;cursor:pointer;}
.err-msg{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.ok-msg{background:var(--success-light);color:var(--success);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.warn-banner{background:var(--warning-light);color:#8a5f16;font-size:12.5px;padding:12px 14px;border-radius:10px;margin-bottom:16px;line-height:1.55;text-align:left;}
.warn-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-size:11.5px;}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13.5px;}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;
}
.sidebar .brand{padding:0 8px 22px;margin-bottom:6px;border-bottom:1px solid var(--border);}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:var(--text-muted);font-size:13.5px;font-weight:600;text-decoration:none;border:none;background:none;
  width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--secondary-light);color:var(--secondary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.user-email{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}

.main{padding:26px 32px 60px;max-width:1180px;}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:24px;font-weight:600;margin:0 0 3px;}
.page-sub{color:var(--text-muted);font-size:13.5px;margin:0;}

/* mobile bottom nav */
.mobile-nav{display:none;}

/* ---------- cards / metrics ---------- */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.metric-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.metric-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;}
.metric-value.warn{color:var(--warning);}
.metric-value.danger{color:var(--danger);}
.metric-value.ok{color:var(--primary-dark);}
.metric-note{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.badge-ok{background:var(--success-light);color:var(--success);}
.badge-warn{background:var(--warning-light);color:var(--warning);}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.badge-neutral{background:var(--surface-2);color:var(--text-muted);}
.badge-surgical{background:var(--secondary-light);color:var(--secondary);}

/* table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);padding:8px 10px;border-bottom:1.5px solid var(--border);font-weight:700;}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.mat-row{cursor:pointer;}
tr.mat-row:hover{background:var(--surface-2);}
tr.lot-row td{background:var(--bg);font-size:12.5px;color:var(--text-muted);}
.mat-name{font-weight:600;color:var(--text);}
.mat-meta{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.chevron{display:inline-block;transition:transform .15s;color:var(--text-muted);margin-right:6px;}
.chevron.open{transform:rotate(90deg);}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search-input{flex:1;min-width:180px;padding:9px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);font-size:13.5px;outline:none;}
.search-input:focus{border-color:var(--primary);}
.select-filter{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);font-size:13px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}
.empty-state p{font-size:13.5px;margin:4px 0;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(51,46,39,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{margin:0 0 4px;font-size:18px;}
.modal-sub{color:var(--text-muted);font-size:12.5px;margin:0 0 18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;}
.toggle-row .lbl{font-size:13px;font-weight:600;}
.toggle-row .desc{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.switch{position:relative;width:40px;height:23px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.15s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
input:checked + .slider{background:var(--primary);}
input:checked + .slider:before{transform:translateX(17px);}

.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.tab{padding:9px 4px;margin-right:18px;font-size:13.5px;font-weight:600;color:var(--text-muted);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--primary-dark);border-color:var(--primary);}

.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border);gap:12px;}
.list-item:last-child{border-bottom:none;}

.chart-wrap{height:230px;position:relative;}

.settings-item{display:flex;align-items:center;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap;}
.settings-item:last-child{border-bottom:none;}
.settings-item .t{font-size:13.5px;font-weight:600;}
.settings-item .d{font-size:12px;color:var(--text-muted);margin-top:2px;max-width:420px;}
.note-box{background:var(--secondary-light);color:var(--secondary);font-size:12px;padding:10px 13px;border-radius:10px;margin-top:6px;line-height:1.5;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:18px 16px 90px;}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
    border-top:1px solid var(--border);z-index:50;padding:6px 4px;justify-content:space-around;
  }
  .mobile-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-muted);font-size:9.5px;font-weight:700;padding:6px 4px;}
  .mobile-nav button svg{width:19px;height:19px;}
  .mobile-nav button.active{color:var(--primary-dark);}
  .form-row{grid-template-columns:1fr;}
  .page-header{flex-direction:column;align-items:flex-start;}
}
</style>
</head>

/* ---------------- CONFIGURAÇÃO DO FIREBASE ----------------

  db = firebase.firestore();
}

function translateFirebaseError(err){
  const code = err && err.code;
  const map = {
    'auth/email-already-in-use':'Já existe uma conta com este e-mail.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/weak-password':'Senha muito fraca (mínimo 6 caracteres).',
    'auth/user-not-found':'E-mail ou senha inválidos.',
    'auth/wrong-password':'E-mail ou senha inválidos.',
    'auth/invalid-credential':'E-mail ou senha inválidos.',
    'auth/missing-password':'Informe a senha.',
    'auth/popup-closed-by-user':'Login cancelado.',
    'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication → Settings → Authorized domains). Adicione o domínio do seu GitHub Pages lá.',
    'auth/configuration-not-found':'O login por e-mail/senha ainda não foi ativado no Firebase (Authentication → Sign-in method).',
    'auth/operation-not-allowed':'Esse método de login ainda não foi ativado no Firebase (Authentication → Sign-in method).',
    'auth/network-request-failed':'Falha de conexão. Verifique a internet e tente de novo.',
  };
  return map[code] || (err && err.message) || 'Ocorreu um erro. Tente novamente.';
}

const SYS_CATEGORIES = ['Consulta','Cirúrgico'];
const NAV = [
  {id:'dashboard', label:'Dashboard', icon:ICONS.dashboard},
  {id:'estoque', label:'Estoque', icon:ICONS.box},
  {id:'movimentacoes', label:'Movimentações', icon:ICONS.swap},
  {id:'reposicao', label:'Reposição', icon:ICONS.cart},
  {id:'relatorios', label:'Relatórios', icon:ICONS.chart},
  {id:'config', label:'Configurações', icon:ICONS.gear},
];

let S = {
  session:null,      // {email}
  route:'dashboard',
  loginMode:'entrar',// entrar | criar
  data:null,         // {materials, movements, categories}
  ui:{ expandedMat:null, estoqueSearch:'', estoqueCat:'todas', movTab:'nova', movType:'saida', toast:null, modal:null }
};

const todayISO = ()=> new Date().toISOString().slice(0,10);

/* ---------------- persistence (Firestore) ---------------- */
let unsubscribeDoc = null;
let suppressNextSnapshotWrite = false;

function userDocRef(uid){ return db.collection('estoques').doc(uid); }

function subscribeUserData(uid){
  if(unsubscribeDoc) unsubscribeDoc();
  unsubscribeDoc = userDocRef(uid).onSnapshot((snap)=>{
    S.data = (snap.exists && snap.data().appData) ? snap.data().appData : emptyData();
    S.dataLoaded = true;
    render();
  }, (err)=>{
    toast('Erro de sincronização: '+translateFirebaseError(err));
  });
}

async function saveUserData(){
  if(!S.session || !db) return;
  try{
    await userDocRef(S.session.uid).set({
      appData: S.data,
      email: S.session.email,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, {merge:true});
  }catch(e){ toast('Não foi possível salvar: '+translateFirebaseError(e)); }
}

function toast(msg){
  S.ui.toast = msg; render();
  setTimeout(()=>{ S.ui.toast=null; render(); }, 2200);
}

/* ---------------- derived stock logic ---------------- */
function matStock(mat){ return (mat.lots||[]).reduce((s,l)=>s+l.qty,0); }

function matStats(mat){
  const stock = matStock(mat);
  const movs = S.data.movements.filter(m=>m.materialId===mat.id);
  const saidas = movs.filter(m=>m.type==='saida');
  const allDates = movs.map(m=>m.date).concat((mat.lots||[]).map(l=>l.receivedAt)).filter(Boolean).sort();
  const firstDate = allDates[0] || mat.createdAt || todayISO();
  const daysActive = Math.max(1, daysBetween(firstDate, todayISO()));
  const eligible = daysActive>=21 || saidas.length>=3;
  const totalSaida = saidas.reduce((s,m)=>s+m.qty,0);
  const avgMonthly = eligible ? (totalSaida / (daysActive/30)) : 0;
  const idealStock = eligible ? Math.round(avgMonthly*1.25*10)/10 : (mat.minStock||0);
  const suggested = Math.max(0, Math.round((idealStock - stock)*10)/10);
  let status='ok';
  if(stock<=0) status='sem-estoque';
  else if(stock < (mat.minStock||0) || (eligible && stock < idealStock*0.6)) status='baixo';
  // validade
  const soon = (mat.lots||[]).filter(l=>l.expiry && daysBetween(todayISO(),l.expiry)>=0 && daysBetween(todayISO(),l.expiry)<=30);
  const expired = (mat.lots||[]).filter(l=>l.expiry && daysBetween(todayISO(),l.expiry)<0);
  return {stock, eligible, avgMonthly, idealStock, suggested, status, soon, expired, saidasCount:saidas.length, daysActive};
}

function findMaterial(id){ return S.data.materials.find(m=>m.id===id); }

async function doRegister(email, pass, confirm){
  email = email.trim().toLowerCase();
  if(!email || !pass) return toast('Preencha e-mail e senha.');
  if(pass.length<6) return toast('Senha muito curta (mín. 6 caracteres).');
  if(pass!==confirm) return toast('As senhas não coincidem.');
  try{ await auth.createUserWithEmailAndPassword(email, pass); }
  catch(e){ toast(translateFirebaseError(e)); }
}
async function doLogin(email, pass){
  email = email.trim().toLowerCase();
  if(!email || !pass) return toast('Preencha e-mail e senha.');
  try{ await auth.signInWithEmailAndPassword(email, pass); }
  catch(e){ toast(translateFirebaseError(e)); }
}
async function doLoginGoogle(){
  try{
    const provider = new firebase.auth.GoogleAuthProvider();
    await auth.signInWithPopup(provider);
  }catch(e){ toast(translateFirebaseError(e)); }
}
async function doLogout(){
  try{ await auth.signOut(); }catch(e){}

  S.session=null; S.data=null; S.route='dashboard'; S.loginMode='entrar';

async function saveMaterial(form, editId){
  const name = form.name.value.trim();
  if(!name) return toast('Informe o nome do material.');
  const category = form.category.value;
  const unit = form.unit.value.trim()||'un';
  const minStock = parseFloat(form.minStock.value)||0;
  const cost = parseFloat(form.cost.value)||0;
  const cirurgico = form.cirurgico.checked;
  if(editId){
    const m = findMaterial(editId);
    Object.assign(m,{name,category,unit,minStock,cost,cirurgico});
  } else {
    S.data.materials.push({id:uid(), name, category, unit, minStock, cost, cirurgico, lots:[], createdAt:todayISO()});
  }
  await saveUserData();
  closeModal();
  toast('Material salvo.');
}

async function deleteMaterial(id){
  S.data.materials = S.data.materials.filter(m=>m.id!==id);
  S.data.movements = S.data.movements.filter(m=>m.materialId!==id);
  await saveUserData();
  closeModal();
  toast('Material removido.');
}

async function registerEntrada(materialId, qty, expiry, note){
  qty = parseFloat(qty);
  if(!materialId) return toast('Selecione um material.');
  if(!qty || qty<=0) return toast('Informe uma quantidade válida.');
  const mat = findMaterial(materialId);
  const lot = {id:uid(), qty, expiry: expiry||null, receivedAt: todayISO()};
  mat.lots.push(lot);
  S.data.movements.unshift({id:uid(), materialId, lotId:lot.id, type:'entrada', qty, date:todayISO(), user:S.session.email, note:note||''});
  await saveUserData();
  toast('Entrada registrada.');
}

async function registerSaida(materialId, qty, note){
  qty = parseFloat(qty);
  if(!materialId) return toast('Selecione um material.');
  if(!qty || qty<=0) return toast('Informe uma quantidade válida.');
  const mat = findMaterial(materialId);
  const total = matStock(mat);
  if(qty>total){ toast('Estoque insuficiente — saída bloqueada (não é permitido estoque negativo).'); return false; }
  // FEFO: ordena lotes por validade (sem validade vai por último), consome
  let remaining = qty;
  const sorted = [...mat.lots].sort((a,b)=>{
    if(!a.expiry && !b.expiry) return a.receivedAt.localeCompare(b.receivedAt);
    if(!a.expiry) return 1; if(!b.expiry) return -1;
    return a.expiry.localeCompare(b.expiry);
  });
  const consumed = [];
  for(const lot of sorted){
    if(remaining<=0) break;
    const take = Math.min(lot.qty, remaining);
    if(take>0){ lot.qty = Math.round((lot.qty-take)*1000)/1000; remaining = Math.round((remaining-take)*1000)/1000; consumed.push({lotId:lot.id, take}); }
  }
  mat.lots = mat.lots.filter(l=>l.qty>0.0001);
  S.data.movements.unshift({id:uid(), materialId, lotId:consumed.map(c=>c.lotId).join(','), type:'saida', qty, date:todayISO(), user:S.session.email, note:note||''});
  await saveUserData();
  toast('Saída registrada (FEFO aplicado).');
  return true;
}

let deferredInstallPrompt = null;

async function handleInstallClick(){
  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt=null;
  } else {
    openModal('install-help');
  }

async function handleUpdateClick(){
  try{
    if('caches' in window){ const keys = await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
    if('serviceWorker' in navigator){ const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map(r=>r.unregister())); }
    toast('Cache limpo. Recarregando…');
    setTimeout(()=>location.reload(), 700);
  }catch(e){ toast('Cache limpo (parcial). Recarregue manualmente se preciso.'); }
}

/* -------- dashboard -------- */
function renderDashboard(){
  const mats = S.data.materials;
  const stats = mats.map(m=>({m, s:matStats(m)}));
  const totalMat = mats.length;
  const baixo = stats.filter(x=>x.s.status==='baixo'||x.s.status==='sem-estoque').length;
  const vencendo = stats.reduce((s,x)=>s+x.s.soon.length,0);
  const vencidos = stats.reduce((s,x)=>s+x.s.expired.length,0);
  const last30 = S.data.movements.filter(m=>m.type==='saida' && daysBetween(m.date, todayISO())<=30);
  const valorConsumo = last30.reduce((s,m)=>{ const mat=findMaterial(m.materialId); return s + (mat? (mat.cost||0)*m.qty : 0); },0);

  if(totalMat===0){
    return emptyState('Nenhum material cadastrado ainda', 'Comece cadastrando os materiais de consulta e cirúrgicos da clínica.', 'Cadastrar primeiro material', ()=>openModal('material'));
  }

  return `
  <div class="metric-grid">
    <div class="metric-card"><div class="metric-label">${ICONS.box.replace('width="18" height="18"','width="14" height="14"')} Total de materiais</div><div class="metric-value">${totalMat}</div></div>
    <div class="metric-card"><div class="metric-label">Baixo estoque</div><div class="metric-value ${baixo?'warn':'ok'}">${baixo}</div><div class="metric-note">materiais abaixo do ideal</div></div>
    <div class="metric-card"><div class="metric-label">Vencendo (30 dias)</div><div class="metric-value ${vencendo?'warn':'ok'}">${vencendo}</div><div class="metric-note">lotes próximos ao vencimento</div></div>
    <div class="metric-card"><div class="metric-label">Vencidos</div><div class="metric-value ${vencidos?'danger':'ok'}">${vencidos}</div><div class="metric-note">lotes fora de validade</div></div>
    <div class="metric-card"><div class="metric-label">Consumo (30 dias)</div><div class="metric-value ok">${fmtMoney(valorConsumo)}</div><div class="metric-note">valorização das saídas</div></div>
  </div>
  <div class="card">
    <div class="card-title">Consumo por categoria — últimos 30 dias</div>
    <div class="chart-wrap"><canvas id="dash-chart"></canvas></div>
  </div>
  <div class="card">
    <div class="card-title">Atenção imediata</div>
    ${renderAttentionList(stats)}
  </div>
  `;
}

function renderAttentionList(stats){
  const items = [];
  stats.forEach(({m,s})=>{
    if(s.status==='sem-estoque') items.push({m,label:'Sem estoque', type:'danger'});
    else if(s.status==='baixo') items.push({m,label:'Baixo estoque', type:'warn'});
    s.expired.forEach(l=> items.push({m,label:`Lote vencido (${fmtDate(l.expiry)})`, type:'danger'}));
    s.soon.forEach(l=> items.push({m,label:`Vence em ${daysBetween(todayISO(),l.expiry)}d`, type:'warn'}));
  });
  if(!items.length) return `<p style="color:var(--text-muted);font-size:13.5px;margin:0;">Tudo em dia — nenhum alerta no momento.</p>`;
  return items.slice(0,10).map(it=>`
    <div class="list-item">
      <div><span class="mat-name">${escapeHtml(it.m.name)}</span>${it.m.cirurgico?` <span class="badge badge-surgical">Cirúrgico</span>`:''}</div>
      <span class="badge badge-${it.type==='danger'?'danger':'warn'}">${it.label}</span>
    </div>`).join('');
}

function drawChart(){
  const canvas = document.getElementById('dash-chart');
  if(!canvas || typeof Chart==='undefined') return;
  const cats = S.data.categories;
  const last30 = S.data.movements.filter(m=>m.type==='saida' && daysBetween(m.date, todayISO())<=30);
  const byCat = cats.map(c=>{
    const ids = S.data.materials.filter(m=>m.category===c).map(m=>m.id);
    return last30.filter(m=>ids.includes(m.materialId)).reduce((s,m)=>s+m.qty,0);
  });
  if(window._olhattaChart) window._olhattaChart.destroy();
  window._olhattaChart = new Chart(canvas.getContext('2d'), {
    type:'bar',
    data:{ labels:cats, datasets:[{ label:'Unidades consumidas', data:byCat, backgroundColor:'#75946F', borderRadius:6, maxBarThickness:46 }]},
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{ y:{beginAtZero:true, grid:{color:'#EFE9DE'}}, x:{grid:{display:false}} } }
  });
}

/* -------- estoque -------- */
function renderEstoque(){
  const q = S.ui.estoqueSearch.toLowerCase();
  const cat = S.ui.estoqueCat;
  let mats = S.data.materials.filter(m=> m.name.toLowerCase().includes(q) && (cat==='todas'||m.category===cat));
  if(!S.data.materials.length) return emptyState('Nenhum material cadastrado', 'Cadastre materiais de consulta e cirúrgicos para começar a controlar o estoque.', 'Cadastrar material', ()=>openModal('material'));

  const rows = mats.map(m=>{
    const s = matStats(m);
    const open = S.ui.expandedMat===m.id;
    const statusBadge = s.status==='sem-estoque'? `<span class="badge badge-danger">Sem estoque</span>`
      : s.status==='baixo'? `<span class="badge badge-warn">Baixo estoque</span>`
      : `<span class="badge badge-ok">OK</span>`;
    const valBadge = s.expired.length? `<span class="badge badge-danger">${s.expired.length} vencido(s)</span>`
      : s.soon.length? `<span class="badge badge-warn">${s.soon.length} a vencer</span>`
      : `<span class="badge badge-neutral">Validade OK</span>`;
    let lotsHtml = '';
    if(open){
      if(!m.lots.length){ lotsHtml = `<tr class="lot-row"><td colspan="6">Nenhum lote em estoque para este material.</td></tr>`; }
      else lotsHtml = m.lots.slice().sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).map(l=>{
        const d = l.expiry? daysBetween(todayISO(),l.expiry): null;
        let vb = `<span class="badge badge-neutral">Sem validade</span>`;
        if(d!==null){ vb = d<0? `<span class="badge badge-danger">Vencido há ${Math.abs(d)}d</span>` : d<=30? `<span class="badge badge-warn">Vence em ${d}d</span>` : `<span class="badge badge-ok">Válido</span>`; }
        return `<tr class="lot-row"><td colspan="2">Lote • recebido em ${fmtDate(l.receivedAt)}</td><td>${l.qty} ${m.unit}</td><td>${fmtDate(l.expiry)}</td><td colspan="2">${vb}</td></tr>`;
      }).join('');
    }
    return `
      <tr class="mat-row" data-toggle="${m.id}">
        <td><span class="chevron ${open?'open':''}">${ICONS.chevron}</span><span class="mat-name">${escapeHtml(m.name)}</span>${m.cirurgico?` <span class="badge badge-surgical">Cirúrgico</span>`:''}<div class="mat-meta">${escapeHtml(m.category)}</div></td>
        <td>${escapeHtml(m.category)}</td>
        <td>${s.stock} ${m.unit}</td>
        <td>${s.eligible? s.idealStock+' '+m.unit : '<span style="color:var(--text-muted);">calculando…</span>'}</td>
        <td>${statusBadge}</td>
        <td>${valBadge}</td>
        <td style="text-align:right;"><button class="btn btn-outline btn-sm" data-edit="${m.id}">Editar</button></td>
      </tr>
      ${lotsHtml}
    `;
  }).join('');

  return `
    <div class="toolbar">
      <input class="search-input" id="estoque-search" placeholder="Buscar material…" value="${escapeHtml(S.ui.estoqueSearch)}">
      <select class="select-filter" id="estoque-cat">
        <option value="todas" ${cat==='todas'?'selected':''}>Todas categorias</option>
        ${S.data.categories.map(c=>`<option value="${escapeHtml(c)}" ${cat===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}
      </select>
    </div>
    <div class="card" style="padding:0;overflow:hidden;">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Material</th><th>Categoria</th><th>Estoque atual</th><th>Estoque ideal</th><th>Status</th><th>Validade</th><th></th></tr></thead>
          <tbody>${rows || `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px;">Nenhum material encontrado.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  `;
}

/* -------- movimentações -------- */
function renderMovimentacoes(){
  if(!S.data.materials.length) return emptyState('Cadastre materiais primeiro', 'Você precisa ter ao menos um material cadastrado para registrar movimentações.', 'Cadastrar material', ()=>openModal('material'));
  const movs = S.data.movements.slice(0,80);
  const rows = movs.map(m=>{
    const mat = findMaterial(m.materialId);
    if(!mat) return '';
    return `<tr>
      <td>${fmtDate(m.date)}</td>
      <td><span class="mat-name">${escapeHtml(mat.name)}</span></td>
      <td><span class="badge ${m.type==='entrada'?'badge-ok':'badge-neutral'}">${m.type==='entrada'?'Entrada':'Saída'}</span></td>
      <td>${m.qty} ${mat.unit}</td>
      <td style="color:var(--text-muted);font-size:12px;">${escapeHtml(m.user)}</td>
      <td style="color:var(--text-muted);font-size:12px;">${escapeHtml(m.note||'—')}</td>
    </tr>`;
  }).join('');
  return `
  <div class="card">
    <div class="card-title">Histórico e auditoria</div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Data</th><th>Material</th><th>Tipo</th><th>Qtd.</th><th>Usuário</th><th>Observação</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:24px;">Nenhuma movimentação registrada.</td></tr>`}</tbody>
      </table>
    </div>
  </div>`;
}

/* -------- reposição -------- */
function renderReposicao(){
  if(!S.data.materials.length) return emptyState('Nada para repor ainda', 'Cadastre materiais e registre movimentações para gerar a lista de reposição.', 'Cadastrar material', ()=>openModal('material'));
  const list = S.data.materials.map(m=>({m, s:matStats(m)})).filter(x=>x.s.eligible && x.s.suggested>0).sort((a,b)=>b.s.suggested-a.s.suggested);
  const notEligible = S.data.materials.filter(m=>!matStats(m).eligible);
  return `
  <div class="card">
    <div class="card-title">Lista de compras sugerida <span class="badge badge-neutral">estoque ideal = 1,25 × consumo médio mensal</span></div>
    ${list.length? `
    <div class="table-wrap"><table>
      <thead><tr><th>Material</th><th>Estoque atual</th><th>Consumo médio/mês</th><th>Estoque ideal</th><th>Sugestão de compra</th></tr></thead>
      <tbody>${list.map(({m,s})=>`<tr>
        <td><span class="mat-name">${escapeHtml(m.name)}</span>${m.cirurgico?` <span class="badge badge-surgical">Cirúrgico</span>`:''}</td>
        <td>${s.stock} ${m.unit}</td>
        <td>${Math.round(s.avgMonthly*10)/10} ${m.unit}</td>
        <td>${s.idealStock} ${m.unit}</td>
        <td><strong style="color:var(--secondary);">${s.suggested} ${m.unit}</strong></td>
      </tr>`).join('')}</tbody>
    </table></div>` : `<p style="color:var(--text-muted);font-size:13.5px;">Nenhuma reposição necessária no momento — estoque dentro do ideal.</p>`}
  </div>
  ${notEligible.length? `<div class="card"><div class="card-title">Ainda calculando</div>
    <p style="color:var(--text-muted);font-size:13px;margin-top:-6px;">Estes materiais ainda não têm histórico suficiente (é preciso 21 dias de uso ou 3 movimentações) — o estoque ideal usa o mínimo cadastrado até lá.</p>
    ${notEligible.map(m=>`<div class="list-item"><span>${escapeHtml(m.name)}</span><span class="badge badge-neutral">${matStats(m).daysActive}d / ${matStats(m).saidasCount} saídas</span></div>`).join('')}
  </div>`:''}
  `;
}

/* -------- relatórios -------- */
function renderRelatorios(){
  if(!S.data.materials.length) return emptyState('Sem dados para relatórios', 'Cadastre materiais e movimentações para ver insights de consumo.', 'Cadastrar material', ()=>openModal('material'));
  const stats = S.data.materials.map(m=>({m,s:matStats(m)}));
  const topConsumo = stats.filter(x=>x.s.avgMonthly>0).sort((a,b)=>b.s.avgMonthly-a.s.avgMonthly).slice(0,6);
  const baixoMovimento = stats.filter(x=>{
    const mov = S.data.movements.filter(mm=>mm.materialId===x.m.id);
    if(!mov.length) return true;
    const last = mov.reduce((d,mm)=> mm.date>d? mm.date:d, mov[0].date);
    return daysBetween(last, todayISO())>45;
  });
  const cirurgicos = S.data.materials.filter(m=>m.cirurgico).length;

  return `
  <div class="metric-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
    <div class="metric-card"><div class="metric-label">Materiais cirúrgicos</div><div class="metric-value">${cirurgicos}</div></div>
    <div class="metric-card"><div class="metric-label">Materiais de consulta</div><div class="metric-value">${S.data.materials.filter(m=>!m.cirurgico).length}</div></div>
    <div class="metric-card"><div class="metric-label">Baixo movimento (45d+)</div><div class="metric-value warn">${baixoMovimento.length}</div></div>
  </div>
  <div class="card">
    <div class="card-title">Tendência de consumo — maior consumo médio mensal</div>
    ${topConsumo.length? topConsumo.map(({m,s})=>`
      <div class="list-item">
        <div><span class="mat-name">${escapeHtml(m.name)}</span>${m.cirurgico?` <span class="badge badge-surgical">Cirúrgico</span>`:''}<div class="mat-meta">${escapeHtml(m.category)}</div></div>
        <span class="badge badge-ok">${Math.round(s.avgMonthly*10)/10} ${m.unit}/mês</span>
      </div>`).join('') : `<p style="color:var(--text-muted);font-size:13.5px;">Ainda sem dados suficientes de consumo.</p>`}
  </div>
  <div class="card">
    <div class="card-title">Itens com baixo movimento</div>
    ${baixoMovimento.length? baixoMovimento.map(({m})=>`
      <div class="list-item"><span class="mat-name">${escapeHtml(m.name)}</span><span class="badge badge-neutral">Parado</span></div>`).join('') :
      `<p style="color:var(--text-muted);font-size:13.5px;">Nenhum item parado — boa rotatividade de estoque.</p>`}
  </div>
  `;
}

/* -------- configurações -------- */

  return `
  <div class="card">
    <div class="card-title">Conta</div>
    <div class="settings-item"><div><div class="t">Logado como</div><div class="d">${escapeHtml(S.session.email)}</div></div><button class="btn btn-outline btn-sm" id="cfg-logout">Sair da conta</button></div>
    <div class="settings-item"><div><div class="t">Sincronização em nuvem</div><div class="d">Seus dados ficam salvos no Firebase e sincronizam automaticamente em qualquer computador ou celular onde você fizer login com esta conta.</div></div><span class="badge badge-ok">Ativa</span></div>
  </div>
  <div class="card">
    <div class="card-title">Aplicativo</div>
    <div class="settings-item"><div><div class="t">Instalar app</div><div class="d">Adicione a Olhatta à tela inicial do celular ou ao desktop para acesso rápido, como um app nativo.</div></div><button class="btn btn-primary btn-sm" id="cfg-install">Instalar</button></div>
    <div class="settings-item"><div><div class="t">Atualizar app</div><div class="d">Limpa o cache local e o service worker, garantindo que você está usando a versão mais recente.</div></div><button class="btn btn-outline btn-sm" id="cfg-update">Atualizar agora</button></div>
  </div>
  <div class="card">
    <div class="card-title">Categorias</div>
    <p style="color:var(--text-muted);font-size:12.5px;margin-top:-8px;">"Consulta" e "Cirúrgico" são categorias do sistema e não podem ser removidas.</p>
    ${S.data.categories.map(c=>`<div class="list-item"><span>${escapeHtml(c)}</span>${SYS_CATEGORIES.includes(c)? `<span class="badge badge-neutral">Sistema</span>` : `<button class="btn btn-ghost btn-sm" data-del-cat="${escapeHtml(c)}">Remover</button>`}</div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px;">
      <input class="search-input" id="new-cat-input" placeholder="Nova categoria…">

    <div class="settings-item"><div><div class="t">Zerar informações</div><div class="d">Remove todos os materiais, lotes e movimentações desta conta. As categorias do sistema são mantidas. Esta ação não pode ser desfeita.</div></div><button class="btn btn-danger btn-sm" id="cfg-reset">Zerar tudo</button></div>
  </div>
  `;

/* -------- shared: empty state -------- */
function emptyState(title, desc, cta, onClick){
  const id='es-cta-'+Math.random().toString(36).slice(2,7);
  setTimeout(()=>{ const b=document.getElementById(id); if(b) b.onclick=onClick; },0);
  return `<div class="card empty-state">${ICONS.eye}<h3 style="margin:6px 0 2px;font-size:16px;">${title}</h3><p>${desc}</p><button class="btn btn-primary btn-sm" id="${id}" style="margin-top:12px;">${cta}</button></div>`;
}

/* ---------------- modals ---------------- */
function renderModal(){
  const {name, payload} = S.ui.modal;
  if(name==='material') return materialModal(payload);
  if(name==='mov') return movModal();
  if(name==='confirm-reset') return confirmModal('Zerar todas as informações?','Isso removerá permanentemente todos os materiais, lotes e movimentações desta conta.','Zerar dados', resetAllData);
  if(name==='confirm-delete-mat') return confirmModal('Remover material?','Isso também apagará o histórico de movimentações deste item.','Remover', ()=>deleteMaterial(payload.id));
  if(name==='install-help') return installHelpModal();
  return '';
}

function materialModal(payload){
  const editId = payload && payload.id;
  const m = editId? findMaterial(editId): null;
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>${m? 'Editar material':'Novo material'}</h3>
      <p class="modal-sub">${m? 'Atualize as informações do material.':'Cadastre um material de consulta ou cirúrgico.'}</p>
      <form id="material-form">
        <div class="field"><label>Nome</label><input name="name" value="${m? escapeHtml(m.name):''}" placeholder="Ex.: Colírio anestésico" required></div>
        <div class="form-row">
          <div class="field"><label>Categoria</label>
            <select name="category">${S.data.categories.map(c=>`<option value="${escapeHtml(c)}" ${m&&m.category===c?'selected':''}>${escapeHtml(c)}</option>`).join('')}</select>
          </div>
          <div class="field"><label>Unidade</label><input name="unit" value="${m? escapeHtml(m.unit):'un'}" placeholder="un, ml, cx…"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>Estoque mínimo</label><input name="minStock" type="number" min="0" step="0.1" value="${m? m.minStock:0}"></div>
          <div class="field"><label>Custo unitário (R$)</label><input name="cost" type="number" min="0" step="0.01" value="${m? m.cost||0:0}"></div>
        </div>
        <div class="toggle-row">
          <div><div class="lbl">Material cirúrgico</div><div class="desc">Recebe destaque especial na listagem</div></div>
          <label class="switch"><input type="checkbox" name="cirurgico" ${m&&m.cirurgico?'checked':''}><span class="slider"></span></label>
        </div>
        <div class="modal-actions">
          ${m? `<button type="button" class="btn btn-danger" id="del-mat-btn">Remover</button>`:''}
          <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>`;
}

function movModal(){
  const type = S.ui.movType;
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3>Nova movimentação</h3>
      <p class="modal-sub">Registre entrada ou saída de material do estoque.</p>
      <div class="tabs">
        <button type="button" class="tab ${type==='entrada'?'active':''}" data-movtype="entrada">Entrada</button>
        <button type="button" class="tab ${type==='saida'?'active':''}" data-movtype="saida">Saída</button>
      </div>
      <form id="mov-form">
        <div class="field"><label>Material</label>
          <select name="materialId" required>
            <option value="">Selecione…</option>
            ${S.data.materials.map(m=>`<option value="${m.id}">${escapeHtml(m.name)} (${matStock(m)} ${m.unit} em estoque)</option>`).join('')}
          </select>
        </div>
        <div class="form-row">
          <div class="field"><label>Quantidade</label><input name="qty" type="number" min="0.01" step="0.01" required></div>
          ${type==='entrada'? `<div class="field"><label>Validade (opcional)</label><input name="expiry" type="date"></div>` : `<div class="field"><label>&nbsp;</label><div class="note-box" style="margin-top:0;">Saída segue FEFO: consome primeiro os lotes que vencem antes.</div></div>`}
        </div>
        <div class="field"><label>Observação (opcional)</label><input name="note" placeholder="Ex.: cirurgia de catarata — paciente Rex"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary">Registrar ${type==='entrada'?'entrada':'saída'}</button>
        </div>
      </form>
    </div>
  </div>`;
}

function confirmModal(title, desc, cta, onConfirm){
  window._confirmAction = onConfirm;
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" style="max-width:400px;">
      <h3>${title}</h3>
      <p class="modal-sub">${desc}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
        <button type="button" class="btn btn-danger-solid" id="modal-confirm">${cta}</button>
      </div>
    </div>
  </div>`;
}

function installHelpModal(){
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" style="max-width:420px;">
      <h3>Instalar a Olhatta</h3>
      <p class="modal-sub">Seu navegador não ofereceu a instalação automática agora. Você ainda pode instalar manualmente:</p>
      <p style="font-size:13.5px;line-height:1.7;">
        <strong>No celular (Android/Chrome):</strong> toque no menu ⋮ e escolha "Instalar app" ou "Adicionar à tela inicial".<br>
        <strong>No iPhone (Safari):</strong> toque em Compartilhar → "Adicionar à Tela de Início".<br>
        <strong>No computador (Chrome/Edge):</strong> clique no ícone de instalação na barra de endereço, ou no menu ⋮ → "Instalar Olhatta".
      </p>
      <div class="note-box">Este app já inclui manifest e service worker prontos. Assim que estiver publicado no GitHub Pages (endereço https), a maioria dos navegadores oferece a instalação automática — em alguns (como Safari/iPhone) o caminho continua sendo manual, como acima.</div>
      <div class="modal-actions"><button type="button" class="btn btn-primary" id="modal-cancel">Entendi</button></div>
    </div>
  </div>`;
}

/* ---------------- events ---------------- */
function attachShellEvents(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.onclick = ()=>{ S.route = el.dataset.route; S.ui.expandedMat=null; render(); };
  });
  const lo = document.getElementById('logout-btn'); if(lo) lo.onclick = doLogout;

  if(S.route==='estoque'){
    document.getElementById('btn-new-material').onclick = ()=>openModal('material');
    document.getElementById('estoque-search').oninput = (e)=>{ S.ui.estoqueSearch=e.target.value; render(); };
    document.getElementById('estoque-search').focus();
    document.getElementById('estoque-search').selectionStart = document.getElementById('estoque-search').value.length;
    document.getElementById('estoque-cat').onchange = (e)=>{ S.ui.estoqueCat=e.target.value; render(); };
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.onclick = ()=>{ const id=el.dataset.toggle; S.ui.expandedMat = S.ui.expandedMat===id? null: id; render(); };
    });
    document.querySelectorAll('[data-edit]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openModal('material',{id:el.dataset.edit}); };
    });
  }
  if(S.route==='movimentacoes'){
    document.getElementById('btn-new-mov').onclick = ()=>openModal('mov');
  }
  if(S.route==='config'){
    document.getElementById('cfg-logout').onclick = doLogout;
    document.getElementById('cfg-install').onclick = handleInstallClick;
    document.getElementById('cfg-update').onclick = handleUpdateClick;
    document.getElementById('cfg-reset').onclick = ()=>openModal('confirm-reset');
    document.getElementById('add-cat-btn').onclick = async ()=>{
      const inp = document.getElementById('new-cat-input');
      await addCategory(inp.value); render();
    };
    document.querySelectorAll('[data-del-cat]').forEach(el=>{
      el.onclick = async ()=>{
        const c = el.dataset.delCat;
        S.data.categories = S.data.categories.filter(x=>x!==c);
        await saveUserData(); render();
      };
    });
  }

  attachModalEvents();
}

function attachModalEvents(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  const cancel = document.getElementById('modal-cancel'); if(cancel) cancel.onclick = closeModal;
  const confirmBtn = document.getElementById('modal-confirm');
  if(confirmBtn) confirmBtn.onclick = ()=>{ if(window._confirmAction) window._confirmAction(); };

  const matForm = document.getElementById('material-form');
  if(matForm){
    matForm.onsubmit = (e)=>{ e.preventDefault(); saveMaterial(matForm, S.ui.modal.payload && S.ui.modal.payload.id); };
    const delBtn = document.getElementById('del-mat-btn');
    if(delBtn) delBtn.onclick = ()=> openModal('confirm-delete-mat', S.ui.modal.payload);
  }

  const movForm = document.getElementById('mov-form');
  if(movForm){
    document.querySelectorAll('[data-movtype]').forEach(el=>{
      el.onclick = ()=>{ S.ui.movType = el.dataset.movtype; render(); };
    });
    movForm.onsubmit = async (e)=>{
      e.preventDefault();
      const materialId = movForm.materialId.value;
      const qty = movForm.qty.value;
      const note = movForm.note.value;
      let ok = true;
      if(S.ui.movType==='entrada') await registerEntrada(materialId, qty, movForm.expiry ? movForm.expiry.value : null, note);
      else ok = await registerSaida(materialId, qty, note);
      if(ok!==false) closeModal();
    };
  }
}

/* ---------------- service worker (instalação como app) ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------------- boot ---------------- */
S.authResolved = false;
S.dataLoaded = false;

function boot(){
  if(!FIREBASE_READY){ render(); return; }
  auth.onAuthStateChanged((user)=>{
    S.authResolved = true;
    if(user){
      S.session = {uid:user.uid, email:user.email};
      S.dataLoaded = false;
      subscribeUserData(user.uid);
    } else {
      if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc=null; }
      S.session = null; S.data = null; S.dataLoaded=false;
    }
    render();
  });
  render();
}
boot();
</script>
</body>
</html>
