<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olhatta • Controle de Estoque</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#5C7355">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#FBF8F3;
  --surface:#FFFFFF;
  --surface-2:#F3F6F0;
  --primary:#7C9473;
  --primary-dark:#5C7355;
  --primary-light:#E7EEE2;
  --secondary:#A9805F;
  --secondary-light:#F1E6D8;
  --text:#33362F;
  --text-muted:#6B6E63;
  --border:#E6E0D2;
  --danger:#B5654A;
  --danger-light:#F4E2DB;
  --warning:#B9862F;
  --warning-light:#F5EAD4;
  --success:#4F7A63;
  --success-light:#DEEBE3;
  --radius:14px;
  --shadow:0 1px 2px rgba(51,54,47,.05), 0 6px 20px -8px rgba(51,54,47,.12);
}
*{box-sizing:border-box;}
html{-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Manrope',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
input,select,textarea{font-family:inherit;}
::selection{background:var(--primary-light);}
*:focus{outline:none;}
button:focus-visible,.nav-item:focus-visible,a:focus-visible,.tab:focus-visible{box-shadow:0 0 0 3px var(--primary-light);border-radius:8px;}

/* ---------- layout ---------- */
#app{min-height:100vh;}
.hidden{display:none !important;}

/* ---------- login ---------- */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px; background:
    radial-gradient(circle at 15% 15%, var(--primary-light) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, var(--secondary-light) 0%, transparent 45%),
    var(--bg);
}
.login-card{
  background:var(--surface); border:1px solid var(--border); border-radius:20px;
  box-shadow:var(--shadow); padding:40px 36px; width:100%; max-width:400px;
}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
.brand-mark{width:42px;height:42px;flex-shrink:0;}
.brand-name{font-family:'Fraunces',serif;font-weight:600;font-size:22px;letter-spacing:.2px;}
.brand-sub{font-size:11.5px;color:var(--text-muted);letter-spacing:.5px;text-transform:uppercase;margin-top:1px;}
.login-title{font-size:20px;font-weight:600;margin:0 0 4px;}
.login-desc{font-size:13.5px;color:var(--text-muted);margin:0 0 24px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:10px;
  font-size:14px;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s;
}
.field input:focus, .field select:focus{border-color:var(--primary);background:var(--surface);}
.field input:disabled{cursor:not-allowed;}
.pass-wrap{position:relative;}
.pass-wrap input{padding-right:42px;}
.pass-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);padding:6px;display:flex;align-items:center;}
.pass-toggle:hover{color:var(--text);}
.pass-toggle svg{width:18px;height:18px;}
.btn{
  border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s, transform .1s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-secondary{background:var(--secondary-light);color:var(--secondary);}
.btn-secondary:hover{filter:brightness(0.97);}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn-outline:hover{border-color:var(--primary);color:var(--primary);}
.btn-danger{background:var(--danger-light);color:var(--danger);}
.btn-danger-solid{background:var(--danger);color:#fff;}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;}
.btn-ghost{background:transparent;color:var(--text-muted);border:none;}
.btn-ghost:hover{color:var(--text);}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.divider-row{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--text-muted);font-size:12px;}
.divider-row .line{flex:1;height:1px;background:var(--border);}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:10px;font-size:13.5px;font-weight:600;width:100%;color:var(--text);}
.google-btn:hover{border-color:var(--text-muted);}
.login-footer{margin-top:20px;text-align:center;font-size:12.5px;color:var(--text-muted);}
.login-footer a{color:var(--secondary);text-decoration:none;font-weight:600;}
.login-switch{text-align:center;font-size:13px;margin-top:16px;color:var(--text-muted);}
.login-switch a{color:var(--primary-dark);font-weight:600;text-decoration:none;cursor:pointer;}
.err-msg{background:var(--danger-light);color:var(--danger);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.ok-msg{background:var(--success-light);color:var(--success);font-size:12.5px;padding:9px 12px;border-radius:8px;margin-bottom:14px;}
.warn-banner{background:var(--warning-light);color:#7a5814;font-size:12.5px;padding:12px 14px;border-radius:10px;margin-bottom:16px;line-height:1.55;text-align:left;}
.warn-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:5px;font-size:11.5px;}
.loading-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-size:13.5px;background:var(--bg);}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh;}
.sidebar{
  background:linear-gradient(180deg,#4E5D46,#3F4B38);color:#EFEFE6;
  padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;
}
.sidebar .brand{padding:0 8px 22px;margin-bottom:6px;border-bottom:1px solid rgba(255,255,255,.12);}
.sidebar .brand-name{color:#F6F4EC;}
.sidebar .brand-sub{color:#C7CDBB;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;
  color:#D9DECB;font-size:13.5px;font-weight:600;text-decoration:none;border:none;background:none;
  width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.08);color:#fff;}
.nav-item.active{background:rgba(255,255,255,.16);color:#fff;}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;}
.avatar{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;}
.user-email{font-size:12px;color:#C7CDBB;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:130px;}

.main{padding:20px 32px 60px;max-width:1220px;}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;}
.sync-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:99px;}
.sync-pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0;}
.sync-ok{background:var(--success-light);color:var(--success);}
.sync-warn{background:var(--warning-light);color:var(--warning);}
.sync-danger{background:var(--danger-light);color:var(--danger);}
.search-trigger{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:10px;color:var(--text-muted);font-size:13px;font-weight:600;margin-left:auto;}
.search-trigger:hover{border-color:var(--primary);color:var(--primary-dark);}
.search-trigger svg{width:15px;height:15px;}
.search-trigger kbd{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:10px;font-family:inherit;color:var(--text-muted);}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
.page-title{font-size:24px;font-weight:600;margin:0 0 3px;}
.page-sub{color:var(--text-muted);font-size:13.5px;margin:0;}

/* período (dia/mês/ano) */
.period-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 10px;margin-bottom:18px;flex-wrap:wrap;position:relative;}
.period-gran{display:flex;background:var(--primary-light);border-radius:9px;padding:3px;gap:2px;}
.pgran{border:none;background:none;padding:6px 13px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--text-muted);}
.pgran.active{background:#fff;color:var(--primary-dark);box-shadow:0 1px 3px rgba(0,0,0,.08);}
.period-ctrl{display:flex;align-items:center;gap:2px;position:relative;}
.icon-btn{border:none;background:none;color:var(--text-muted);padding:7px;border-radius:8px;display:flex;}
.icon-btn:hover{background:var(--surface-2);color:var(--text);}
.icon-btn svg{width:16px;height:16px;}
.period-label{border:none;background:none;font-family:'Fraunces',serif;font-size:14.5px;font-weight:600;color:var(--text);padding:6px 10px;cursor:pointer;border-radius:8px;}
.period-label:hover{background:var(--surface-2);}

/* saudação */
.dash-greeting{margin-bottom:16px;}
.dash-greeting-title{font-family:'Fraunces',serif;font-size:25px;font-weight:600;color:var(--text);}
.dash-greeting-sub{font-size:13px;color:var(--text-muted);margin-top:2px;}

/* ações rápidas */
.quick-actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px;}
.quick-btn{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:12px;padding:14px 16px;font-size:13.5px;font-weight:700;color:var(--text);box-shadow:var(--shadow);text-align:left;}
.quick-btn:hover{border-color:var(--primary);}
.quick-btn .qi{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.quick-btn .qi svg{width:19px;height:19px;}
.qi-green{background:var(--primary-light);color:var(--primary-dark);}
.qi-brown{background:var(--secondary-light);color:var(--secondary);}
.qi-red{background:var(--danger-light);color:var(--danger);}

/* mobile bottom nav */
.mobile-nav{display:none;}

/* ---------- cards / metrics ---------- */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px;}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.metric-label{font-size:11.5px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.metric-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;}
.metric-value.warn{color:var(--warning);}
.metric-value.danger{color:var(--danger);}
.metric-value.ok{color:var(--primary-dark);}
.metric-note{font-size:11.5px;color:var(--text-muted);margin-top:2px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
.card-title{font-size:15px;font-weight:700;margin:0 0 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.chart-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:18px;}

/* badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}
.badge-ok{background:var(--success-light);color:var(--success);}
.badge-warn{background:var(--warning-light);color:var(--warning);}
.badge-danger{background:var(--danger-light);color:var(--danger);}
.badge-neutral{background:var(--surface-2);color:var(--text-muted);}
.badge-surgical{background:var(--secondary-light);color:var(--secondary);}

/* table */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);padding:8px 10px;border-bottom:1.5px solid var(--border);font-weight:700;white-space:nowrap;}
th.sortable{cursor:pointer;}
th.sortable:hover{color:var(--text);}
.sort-arrow{margin-left:4px;font-size:10px;display:inline-block;color:var(--text-muted);opacity:.55;}
.sort-arrow.active{opacity:1;color:var(--primary-dark);font-weight:700;}
td{padding:11px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
tr.mat-row{cursor:pointer;}
tr.mat-row:hover{background:var(--surface-2);}
tr.lot-row td{background:var(--bg);font-size:12.5px;color:var(--text-muted);}
.mat-code{font-size:11.5px;color:var(--text-muted);font-family:monospace;}
.mat-name{font-weight:600;color:var(--text);}
.mat-meta{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.chevron{display:inline-block;transition:transform .15s;color:var(--text-muted);margin-right:6px;}
.chevron.open{transform:rotate(90deg);}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px;}
.search-input{flex:1;min-width:180px;padding:9px 13px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);font-size:13.5px;outline:none;}
.search-input:focus{border-color:var(--primary);}
.select-filter{padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;background:var(--bg);font-size:13px;}

.empty-state{text-align:center;padding:40px 20px;color:var(--text-muted);}
.empty-state svg{width:44px;height:44px;margin-bottom:10px;opacity:.5;}
.empty-state p{font-size:13.5px;margin:4px 0;}

/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(51,54,47,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal{background:var(--surface);border-radius:18px;padding:26px;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{margin:0 0 4px;font-size:18px;}
.modal-sub{color:var(--text-muted);font-size:12.5px;margin:0 0 18px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;margin-bottom:14px;}
.toggle-row .lbl{font-size:13px;font-weight:600;}
.toggle-row .desc{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.switch{position:relative;width:40px;height:23px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--border);border-radius:99px;transition:.15s;cursor:pointer;}
.slider:before{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;}
input:checked + .slider{background:var(--primary);}
input:checked + .slider:before{transform:translateX(17px);}

.tabs{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);}
.tab{padding:9px 4px;margin-right:18px;font-size:13.5px;font-weight:600;color:var(--text-muted);border:none;background:none;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab.active{color:var(--primary-dark);border-color:var(--primary);}

.list-item{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;border-bottom:1px solid var(--border);gap:12px;}
.list-item:last-child{border-bottom:none;}

.chart-wrap{height:230px;position:relative;}

.settings-item{display:flex;align-items:center;justify-content:space-between;padding:16px 4px;border-bottom:1px solid var(--border);gap:16px;flex-wrap:wrap;}
.settings-item:last-child{border-bottom:none;}
.settings-item .t{font-size:13.5px;font-weight:600;}
.settings-item .d{font-size:12px;color:var(--text-muted);margin-top:2px;max-width:420px;}
.note-box{background:var(--secondary-light);color:var(--secondary);font-size:12px;padding:10px 13px;border-radius:10px;margin-top:6px;line-height:1.5;}

.gsr-item{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;border-radius:8px;cursor:pointer;gap:10px;}
.gsr-item:hover{background:var(--surface-2);}
.gsr-empty{padding:18px 4px;font-size:13px;color:var(--text-muted);text-align:center;}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

@media (max-width:860px){
  .shell{grid-template-columns:1fr;}
  .sidebar{display:none;}
  .main{padding:16px 16px 90px;}
  .mobile-nav{
    display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
    border-top:1px solid var(--border);z-index:50;padding:6px 4px;justify-content:space-around;
  }
  .mobile-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-muted);font-size:9.5px;font-weight:700;padding:6px 4px;}
  .mobile-nav button svg{width:19px;height:19px;}
  .mobile-nav button.active{color:var(--primary-dark);}
  .form-row{grid-template-columns:1fr;}
  .two-col{grid-template-columns:1fr;}
  .chart-grid{grid-template-columns:1fr;}
  .page-header{flex-direction:column;align-items:flex-start;}
  .search-trigger span.kbd-hint{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================================
   OLHATTA — CONTROLE DE ESTOQUE
   Persistência: Firebase Authentication (e-mail/senha + Google) e
   Firestore (um documento por conta, sincronizado em tempo real, com
   persistência offline habilitada para reduzir risco de perda de dados).
   ========================================================================= */

/* ---------------- CONFIGURAÇÃO DO FIREBASE ---------------- */
const firebaseConfig = {
  apiKey: "AIzaSyDZBDp0USiOTTe-6YI7VFUJXZl55MambqM",
  authDomain: "olhatta-estoque.firebaseapp.com",
  projectId: "olhatta-estoque",
  storageBucket: "olhatta-estoque.firebasestorage.app",
  messagingSenderId: "869965754664",
  appId: "1:869965754664:web:6bc15fa417d60e7ed2e01d"
};

const FIREBASE_READY = !String(firebaseConfig.apiKey).includes('COLE_AQUI');
let auth = null, db = null;
if(FIREBASE_READY){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
}

function translateFirebaseError(err){
  const code = err && err.code;
  const map = {
    'auth/email-already-in-use':'Já existe uma conta com este e-mail.',
    'auth/invalid-email':'E-mail inválido.',
    'auth/weak-password':'Senha muito fraca (mínimo 6 caracteres).',
    'auth/user-not-found':'E-mail ou senha inválidos.',
    'auth/wrong-password':'E-mail ou senha inválidos.',
    'auth/invalid-credential':'E-mail ou senha inválidos.',
    'auth/missing-password':'Informe a senha.',
    'auth/popup-closed-by-user':'Login cancelado.',
    'auth/unauthorized-domain':'Este endereço não está autorizado no Firebase (Authentication → Settings → Authorized domains). Adicione o domínio do seu GitHub Pages lá.',
    'auth/configuration-not-found':'O login por e-mail/senha ainda não foi ativado no Firebase (Authentication → Sign-in method).',
    'auth/operation-not-allowed':'Esse método de login ainda não foi ativado no Firebase (Authentication → Sign-in method).',

/* ---------------- período (dia/mês/ano) ---------------- */
function periodRange(p){
  const d = new Date(p.refDate+'T00:00:00');
  if(p.gran==='dia') return {start:p.refDate, end:p.refDate};
  if(p.gran==='mes'){
    const y=d.getFullYear(), m=d.getMonth();
    return {start:new Date(y,m,1).toISOString().slice(0,10), end:new Date(y,m+1,0).toISOString().slice(0,10)};
  }
  const y=d.getFullYear();
  return {start:`${y}-01-01`, end:`${y}-12-31`};
}
function inPeriod(dateStr, p){ const r=periodRange(p); return dateStr>=r.start && dateStr<=r.end; }
function periodLabel(p){
  const d = new Date(p.refDate+'T00:00:00');
  if(p.gran==='dia') return p.refDate===todayISO()? 'Hoje' : fmtDate(p.refDate);
  if(p.gran==='mes') return cap(d.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}));
  return String(d.getFullYear());
}
function shiftPeriod(action){
  const p = S.ui.period;
  if(action==='hoje'){ p.refDate = todayISO(); return; }
  const d = new Date(p.refDate+'T00:00:00');
  const dir = action==='prev'? -1 : 1;
  if(p.gran==='dia') d.setDate(d.getDate()+dir);
  else if(p.gran==='mes') d.setMonth(d.getMonth()+dir);
  else d.setFullYear(d.getFullYear()+dir);
  p.refDate = d.toISOString().slice(0,10);
}

/* ---------------- derived stock logic ---------------- */
function matStock(mat){ return (mat.lots||[]).reduce((s,l)=>s+l.qty,0); }

function matStats(mat){
  const stock = matStock(mat);
  const movs = S.data.movements.filter(m=>m.materialId===mat.id);
  const saidas = movs.filter(m=>m.type==='saida');
  const allDates = movs.map(m=>m.date).concat((mat.lots||[]).map(l=>l.receivedAt)).filter(Boolean).sort();
  const firstDate = allDates[0] || mat.createdAt || todayISO();
  const daysActive = Math.max(1, daysBetween(firstDate, todayISO()));
  const eligible = daysActive>=21 || saidas.length>=3;
  const totalSaida = saidas.reduce((s,m)=>s+m.qty,0);
  const avgMonthly = eligible ? (totalSaida / (daysActive/30)) : 0;
  const idealStock = eligible ? Math.round(avgMonthly*1.25*10)/10 : (mat.minStock||0);
  const suggested = Math.max(0, Math.round((idealStock - stock)*10)/10);
  let status='ok';
  if(stock<=0) status='sem-estoque';
  else if(stock < (mat.minStock||0) || (eligible && stock < idealStock*0.6)) status='baixo';
  const tracksExpiry = mat.tracksExpiry!==false;
  const soon = tracksExpiry? (mat.lots||[]).filter(l=>l.expiry && daysBetween(todayISO(),l.expiry)>=0 && daysBetween(todayISO(),l.expiry)<=30) : [];
  const expired = tracksExpiry? (mat.lots||[]).filter(l=>l.expiry && daysBetween(todayISO(),l.expiry)<0) : [];
  return {stock, eligible, avgMonthly, idealStock, suggested, status, soon, expired, saidasCount:saidas.length, daysActive};
}

function findMaterial(id){ return S.data.materials.find(m=>m.id===id); }

function consumeFEFO(mat, qty){
  let remaining = qty;
  const sorted = [...mat.lots].sort((a,b)=>{
    if(!a.expiry && !b.expiry) return a.receivedAt.localeCompare(b.receivedAt);
    if(!a.expiry) return 1; if(!b.expiry) return -1;
    return a.expiry.localeCompare(b.expiry);
  });
  const consumed = [];
  for(const lot of sorted){
    if(remaining<=0) break;
    const take = Math.min(lot.qty, remaining);
    if(take>0){ lot.qty = Math.round((lot.qty-take)*1000)/1000; remaining = Math.round((remaining-take)*1000)/1000; consumed.push({lotId:lot.id, take}); }
  }
  mat.lots = mat.lots.filter(l=>l.qty>0.0001);
  return consumed;
}

async function saveMaterial(form, editId){
  const name = form.name.value.trim();
  if(!name) return toast('Informe o nome do material.');
  const dupName = S.data.materials.find(m=>m.name.trim().toLowerCase()===name.toLowerCase() && m.id!==editId);
  if(dupName) return toast('Já existe um material com esse nome.');
  const code = form.code.value.trim();
  if(code){
    const dup = S.data.materials.find(m=>m.code && m.code.toLowerCase()===code.toLowerCase() && m.id!==editId);
    if(dup) return toast('Já existe um material com esse código.');
  }
  const category = form.category.value;
  const unit = form.unit.value.trim()||'un';
  const minStock = parseFloat(form.minStock.value)||0;
  const cost = parseFloat(form.cost.value)||0;
  const tracksExpiry = form.tracksExpiry.checked;
  if(editId){
    const m = findMaterial(editId);
    Object.assign(m,{name,code,category,unit,minStock,cost,tracksExpiry});
    if(!tracksExpiry) m.lots.forEach(l=> l.expiry=null);
  } else {
    const initialQty = parseFloat(form.initialQty ? form.initialQty.value : 0) || 0;
    const initialExpiry = (tracksExpiry && form.initialExpiry) ? form.initialExpiry.value : null;
    const newMat = {id:uid(), code, name, category, unit, minStock, cost, tracksExpiry, lots:[], createdAt:todayISO()};
    S.data.materials.push(newMat);
    if(initialQty>0){
      const lot = {id:uid(), qty:initialQty, expiry:initialExpiry||null, receivedAt:todayISO()};
      newMat.lots.push(lot);
      S.data.movements.unshift({id:uid(), materialId:newMat.id, lotId:lot.id, type:'entrada', qty:initialQty, date:todayISO(), user:S.session.email, note:'Estoque inicial'});
    }
  }
  await saveUserData();
  closeModal();
  toast('Material salvo.');
}

async function deleteMaterial(id){
  S.data.materials = S.data.materials.filter(m=>m.id!==id);
  S.data.movements = S.data.movements.filter(m=>m.materialId!==id);

async function registerEntrada(materialId, qty, expiry, note){
  qty = parseFloat(qty);
  if(!materialId) return toast('Selecione um material.');
  if(!qty || qty<=0) return toast('Informe uma quantidade válida.');
  const mat = findMaterial(materialId);
  const lot = {id:uid(), qty, expiry: (mat.tracksExpiry!==false && expiry)? expiry : null, receivedAt: todayISO()};
  mat.lots.push(lot);
  S.data.movements.unshift({id:uid(), materialId, lotId:lot.id, type:'entrada', qty, date:todayISO(), user:S.session.email, note:note||''});
  await saveUserData();
  toast('Entrada registrada.');
}

async function registerSaida(materialId, qty, note, motivo){
  qty = parseFloat(qty);
  if(!materialId) return toast('Selecione um material.');
  if(!qty || qty<=0) return toast('Informe uma quantidade válida.');
  const mat = findMaterial(materialId);
  const total = matStock(mat);
  if(qty>total){ toast('Estoque insuficiente — saída bloqueada (não é permitido estoque negativo).'); return false; }
  const consumed = consumeFEFO(mat, qty);
  S.data.movements.unshift({id:uid(), materialId, lotId:consumed.map(c=>c.lotId).join(','), type:'saida', qty, date:todayISO(), user:S.session.email, note:note||'', motivo:motivo||'Outro'});
  await saveUserData();
  toast('Saída registrada (FEFO aplicado).');
  return true;
}

async function registerAjuste(materialId, newQtyRaw, note){
  const newQty = parseFloat(newQtyRaw);
  if(isNaN(newQty) || newQty<0) return toast('Informe uma quantidade válida.');
  const mat = findMaterial(materialId);
  const current = matStock(mat);
  const diff = Math.round((newQty-current)*1000)/1000;
  if(diff===0){ toast('O valor informado já é o estoque atual.'); return; }
  if(diff>0){ mat.lots.push({id:uid(), qty:diff, expiry:null, receivedAt:todayISO()}); }
  else{ consumeFEFO(mat, Math.abs(diff)); }
  S.data.movements.unshift({id:uid(), materialId, type:'ajuste', qty:diff, date:todayISO(), user:S.session.email, note: note||'Ajuste manual de estoque'});
  await saveUserData();
  toast('Estoque ajustado.');
}

function renderAttentionList(stats){
  const items = [];
  stats.forEach(({m,s})=>{
    if(s.status==='sem-estoque') items.push({m,label:'Sem estoque', type:'danger'});

    s.expired.forEach(l=> items.push({m,label:`Lote vencido (${fmtDate(l.expiry)})`, type:'danger'}));
    s.soon.forEach(l=> items.push({m,label:`Vence em ${daysBetween(todayISO(),l.expiry)}d`, type:'warn'}));
  });
  if(!items.length) return `<p style="color:var(--text-muted);font-size:13.5px;margin:0;">Tudo em dia — nenhum alerta no momento.</p>`;
  return items.slice(0,10).map(it=>`
    <div class="list-item">
      <div><span class="mat-name">${escapeHtml(it.m.name)}</span>${isSurgical(it.m)?` <span class="badge badge-surgical">Cirúrgico</span>`:''}</div>
      <span class="badge badge-${it.type==='danger'?'danger':'warn'}">${it.label}</span>
    </div>`).join('');
}

function drawCharts(){
  if(typeof Chart==='undefined') return;
  const catCanvas = document.getElementById('dash-chart-cat');
  if(catCanvas){
    const cats = S.data.categories;
    const periodMovs = S.data.movements.filter(m=>m.type==='saida' && inPeriod(m.date, S.ui.period));
    const byCat = cats.map(c=>{
      const ids = S.data.materials.filter(m=>m.category===c).map(m=>m.id);
      return periodMovs.filter(m=>ids.includes(m.materialId)).reduce((s,m)=>s+m.qty,0);
    });

      options:{ responsive:true, maintainAspectRatio:false,

  }
  const trendCanvas = document.getElementById('dash-chart-trend');
  if(trendCanvas){
    const months = [];
    const now = new Date();
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d); }

    if(window._chartTrend) window._chartTrend.destroy();
    window._chartTrend = new Chart(trendCanvas.getContext('2d'), {
      type:'line',

      options:{ responsive:true, maintainAspectRatio:false,
        plugins:{legend:{display:false}},

  const splitCanvas = document.getElementById('dash-chart-split');

    });
  }
}

/* -------- estoque -------- */
function nearestExpiry(m){
  if(m.tracksExpiry===false) return '9999-99-99';
  const exp = (m.lots||[]).map(l=>l.expiry).filter(Boolean).sort();
  return exp[0] || '9999-99-99';
}
const STATUS_RANK = {'sem-estoque':0, 'baixo':1, 'ok':2};

function sortMats(mats){
  const {field,dir} = S.ui.estoqueSort; const mul = dir==='asc'?1:-1;
  return mats.slice().sort((a,b)=>{
    let av,bv;
    if(field==='code'){ av=(a.code||'').toLowerCase(); bv=(b.code||'').toLowerCase(); }
    else if(field==='category'){ av=a.category.toLowerCase(); bv=b.category.toLowerCase(); }
    else if(field==='date'){ av=a.createdAt||''; bv=b.createdAt||''; }
    else if(field==='stock'){ av=matStock(a); bv=matStock(b); }
    else if(field==='ideal'){ av=matStats(a).idealStock; bv=matStats(b).idealStock; }
    else if(field==='status'){ av=STATUS_RANK[matStats(a).status]; bv=STATUS_RANK[matStats(b).status]; }
    else if(field==='validade'){ av=nearestExpiry(a); bv=nearestExpiry(b); }
    else { av=a.name.toLowerCase(); bv=b.name.toLowerCase(); }
    if(av<bv) return -1*mul; if(av>bv) return 1*mul; return 0;
  });
}
function sortArrow(field){
  const active = S.ui.estoqueSort.field===field;
  return active
    ? `<span class="sort-arrow active">${S.ui.estoqueSort.dir==='asc'?'▲':'▼'}</span>`
    : `<span class="sort-arrow">⇅</span>`;
}

function renderEstoque(){
  const q = S.ui.estoqueSearch.toLowerCase();
  const cat = S.ui.estoqueCat;
  if(!S.data.materials.length) return emptyState('Nenhum material cadastrado', 'Cadastre materiais de consulta e cirúrgicos para começar a controlar o estoque.', 'Cadastrar material', ()=>openModal('material'));
  let mats = S.data.materials.filter(m=> (m.name.toLowerCase().includes(q) || (m.code||'').toLowerCase().includes(q)) && (cat==='todas'||m.category===cat));
  mats = sortMats(mats);

  const rows = mats.map(m=>{
    const s = matStats(m);
    const open = S.ui.expandedMat===m.id;
    const tracksExpiry = m.tracksExpiry!==false;
    const statusBadge = s.status==='sem-estoque'? `<span class="badge badge-danger">Sem estoque</span>`
      : s.status==='baixo'? `<span class="badge badge-warn">Baixo estoque</span>`
      : `<span class="badge badge-ok">OK</span>`;
    const valBadge = !tracksExpiry? `<span class="badge badge-neutral">Sem validade</span>`
      : s.expired.length? `<span class="badge badge-danger">${s.expired.length} vencido(s)</span>`
      : s.soon.length? `<span class="badge badge-warn">${s.soon.length} a vencer</span>`
      : `<span class="badge badge-neutral">Validade OK</span>`;
    let lotsHtml = '';
    if(open){
      const c30 = S.data.movements.filter(mm=>mm.materialId===m.id && mm.type==='saida' && daysBetween(mm.date,todayISO())<=30).reduce((s,mm)=>s+mm.qty,0);
      lotsHtml += `<tr class="lot-row"><td colspan="9">
        <strong style="color:var(--text);">Análise de consumo:</strong>
        Consumo 30 dias: <strong>${c30} ${m.unit}</strong> &nbsp;•&nbsp;
        Consumo médio mensal: <strong>${s.eligible? (Math.round(s.avgMonthly*10)/10)+' '+m.unit : 'calculando…'}</strong> &nbsp;•&nbsp;
        Estoque ideal: <strong>${s.eligible? s.idealStock+' '+m.unit : (m.minStock||0)+' '+m.unit+' (mínimo)'}</strong>
      </td></tr>`;
      if(!m.lots.length){ lotsHtml += `<tr class="lot-row"><td colspan="9">Nenhum lote em estoque para este material.</td></tr>`; }
      else lotsHtml += m.lots.slice().sort((a,b)=>(a.expiry||'9999').localeCompare(b.expiry||'9999')).map(l=>{
        const d = l.expiry? daysBetween(todayISO(),l.expiry): null;
        let vb = `<span class="badge badge-neutral">Sem validade</span>`;
        if(d!==null){ vb = d<0? `<span class="badge badge-danger">Vencido há ${Math.abs(d)}d</span>` : d<=30? `<span class="badge badge-warn">Vence em ${d}d</span>` : `<span class="badge badge-ok">Válido</span>`; }
        return `<tr class="lot-row"><td colspan="4">Lote • recebido em ${fmtDate(l.receivedAt)}</td><td>${l.qty} ${m.unit}</td><td>${fmtDate(l.expiry)}</td><td colspan="2">${vb}</td></tr>`;
      }).join('');
    }
    return `
      <tr class="mat-row" data-toggle="${m.id}">
        <td><span class="mat-code">${escapeHtml(m.code||'—')}</span></td>

/* -------- movimentações -------- */
function renderMovimentacoes(){
  if(!S.data.materials.length) return emptyState('Cadastre materiais primeiro', 'Você precisa ter ao menos um material cadastrado para registrar movimentações.', 'Cadastrar material', ()=>openModal('material'));
  const movs = S.data.movements.filter(m=>inPeriod(m.date, S.ui.period)).slice(0,150);
  const typeBadge = (t)=> t==='entrada'? `<span class="badge badge-ok">Entrada</span>` : t==='saida'? `<span class="badge badge-neutral">Saída</span>` : `<span class="badge badge-surgical">Ajuste</span>`;
  const rows = movs.map(m=>{
    const mat = findMaterial(m.materialId);
    if(!mat) return '';
    return `<tr>
      <td>${fmtDate(m.date)}</td>
      <td><span class="mat-code">${escapeHtml(mat.code||'—')}</span></td>
      <td><span class="mat-name">${escapeHtml(mat.name)}</span></td>
      <td>${typeBadge(m.type)}</td>
      <td>${m.type==='saida'? escapeHtml(m.motivo||'—') : '—'}</td>

    <div class="card-title">Histórico e auditoria — ${periodLabel(S.ui.period).toLowerCase()}</div>

      <table>

}

/* -------- reposição -------- */

  if(!S.data.materials.length) return emptyState('Nada para repor ainda', 'Cadastre materiais e registre movimentações para gerar a lista de reposição.', 'Cadastrar material', ()=>openModal('material'));
  const list = S.data.materials.map(m=>({m, s:matStats(m)})).filter(x=>x.s.eligible && x.s.suggested>0).sort((a,b)=>b.s.suggested-a.s.suggested);
  const notEligible = S.data.materials.filter(m=>!matStats(m).eligible);
  return `
  <div class="card">
    <div class="card-title">Lista de compras sugerida <span class="badge badge-neutral">estoque ideal = 1,25 × consumo médio mensal</span></div>
    ${list.length? `
    <div class="table-wrap"><table>
      <thead><tr><th>Código</th><th>Material</th><th>Estoque atual</th><th>Consumo médio/mês</th><th>Estoque ideal</th><th>Sugestão de compra</th></tr></thead>
      <tbody>${list.map(({m,s})=>`<tr>
        <td><span class="mat-code">${escapeHtml(m.code||'—')}</span></td>
        <td><span class="mat-name">${escapeHtml(m.name)}</span>${isSurgical(m)?` <span class="badge badge-surgical">Cirúrgico</span>`:''}</td>
        <td>${s.stock} ${m.unit}</td>

    ${notEligible.map(m=>`<div class="list-item"><span>${escapeHtml(m.name)}</span><span class="badge badge-neutral">${matStats(m).daysActive}d / ${matStats(m).saidasCount} saídas</span></div>`).join('')}

  `;
}

/* -------- relatórios -------- */
function renderRelatorios(){
  if(!S.data.materials.length) return emptyState('Sem dados para relatórios', 'Cadastre materiais e movimentações para ver insights de consumo.', 'Cadastrar material', ()=>openModal('material'));
  const stats = S.data.materials.map(m=>({m,s:matStats(m)}));
  const topConsumo = stats.filter(x=>x.s.avgMonthly>0).sort((a,b)=>b.s.avgMonthly-a.s.avgMonthly).slice(0,6);
  const baixoMovimento = stats.filter(x=>{
    const mov = S.data.movements.filter(mm=>mm.materialId===x.m.id);
    if(!mov.length) return true;
    const last = mov.reduce((d,mm)=> mm.date>d? mm.date:d, mov[0].date);
    return daysBetween(last, todayISO())>45;
  });
  const cirurgicos = S.data.materials.filter(isSurgical).length;
  const periodMovs = S.data.movements.filter(m=>inPeriod(m.date, S.ui.period));
  const periodEntradas = periodMovs.filter(m=>m.type==='entrada').reduce((s,m)=>s+m.qty,0);
  const periodSaidas = periodMovs.filter(m=>m.type==='saida').reduce((s,m)=>s+m.qty,0);
  const periodValor = periodMovs.filter(m=>m.type==='saida').reduce((s,m)=>{ const mat=findMaterial(m.materialId); return s+(mat?(mat.cost||0)*m.qty:0); },0);
  const periodPerdas = periodMovs.filter(m=>m.type==='saida' && (m.motivo==='Perda' || m.motivo==='Vencimento'));
  const perdasQtd = periodPerdas.reduce((s,m)=>s+m.qty,0);
  const perdasValor = periodPerdas.reduce((s,m)=>{ const mat=findMaterial(m.materialId); return s+(mat?(mat.cost||0)*m.qty:0); },0);
  const perdasPct = periodSaidas>0? Math.round((perdasQtd/periodSaidas)*100) : 0;
  const perdasPorMaterial = {};
  periodPerdas.forEach(m=>{ perdasPorMaterial[m.materialId] = (perdasPorMaterial[m.materialId]||0)+m.qty; });
  const perdasTop = Object.entries(perdasPorMaterial).sort((a,b)=>b[1]-a[1]).slice(0,5);

  return `
  <div class="card">
    <div class="card-title">Movimentação no período — ${periodLabel(S.ui.period).toLowerCase()}</div>
    <div class="metric-grid" style="margin-bottom:0;">
      <div class="metric-card"><div class="metric-label">Entradas</div><div class="metric-value ok">${periodEntradas}</div></div>
      <div class="metric-card"><div class="metric-label">Saídas</div><div class="metric-value">${periodSaidas}</div></div>
      <div class="metric-card"><div class="metric-label">Valor consumido</div><div class="metric-value ok">${fmtMoney(periodValor)}</div></div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Perdas e desperdícios — ${periodLabel(S.ui.period).toLowerCase()}</div>
    ${periodPerdas.length? `
    <div class="metric-grid" style="margin-bottom:0;">
      <div class="metric-card"><div class="metric-label">Unidades perdidas</div><div class="metric-value danger">${perdasQtd}</div></div>
      <div class="metric-card"><div class="metric-label">Valor perdido</div><div class="metric-value danger">${fmtMoney(perdasValor)}</div></div>
      <div class="metric-card"><div class="metric-label">% das saídas do período</div><div class="metric-value ${perdasPct>15?'danger':'warn'}">${perdasPct}%</div></div>
    </div>
    <div style="margin-top:14px;">
      ${perdasTop.map(([mid,qty])=>{ const mat=findMaterial(mid); return mat? `<div class="list-item"><span class="mat-name">${escapeHtml(mat.name)}</span><span class="badge badge-danger">${qty} ${mat.unit}</span></div>` : ''; }).join('')}
    </div>` : `<p style="color:var(--text-muted);font-size:13.5px;">Nenhuma perda ou vencimento registrado neste período.</p>`}
  </div>
  <div class="metric-grid" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr));">
    <div class="metric-card"><div class="metric-label">Materiais cirúrgicos</div><div class="metric-value">${cirurgicos}</div></div>
    <div class="metric-card"><div class="metric-label">Materiais de consulta</div><div class="metric-value">${S.data.materials.filter(m=>!isSurgical(m)).length}</div></div>
    <div class="metric-card"><div class="metric-label">Baixo movimento (45d+)</div><div class="metric-value warn">${baixoMovimento.length}</div></div>
  </div>
  <div class="card">
    <div class="card-title">Tendência de consumo — maior consumo médio mensal (histórico completo)</div>
    ${topConsumo.length? topConsumo.map(({m,s})=>`
      <div class="list-item">
        <div><span class="mat-name">${escapeHtml(m.name)}</span>${isSurgical(m)?` <span class="badge badge-surgical">Cirúrgico</span>`:''}<div class="mat-meta">${escapeHtml(m.category)}</div></div>
        <span class="badge badge-ok">${Math.round(s.avgMonthly*10)/10} ${m.unit}/mês</span>
      </div>`).join('') : `<p style="color:var(--text-muted);font-size:13.5px;">Ainda sem dados suficientes de consumo.</p>`}
  </div>
  <div class="card">
    <div class="card-title">Itens com baixo movimento</div>
    ${baixoMovimento.length? baixoMovimento.map(({m})=>`
      <div class="list-item"><span class="mat-name">${escapeHtml(m.name)}</span><span class="badge badge-neutral">Parado</span></div>`).join('') :
      `<p style="color:var(--text-muted);font-size:13.5px;">Nenhum item parado — boa rotatividade de estoque.</p>`}
  </div>
  `;
}

/* -------- shared: empty state -------- */
function emptyState(title, desc, cta, onClick){
  const id='es-cta-'+Math.random().toString(36).slice(2,7);
  setTimeout(()=>{ const b=document.getElementById(id); if(b) b.onclick=onClick; },0);
  return `<div class="card empty-state">${ICONS.eye}<h3 style="margin:6px 0 2px;font-size:16px;">${title}</h3><p>${desc}</p><button class="btn btn-primary btn-sm" id="${id}" style="margin-top:12px;">${cta}</button></div>`;
}

/* ---------------- modals ---------------- */
function renderModal(){
  const {name, payload} = S.ui.modal;
  if(name==='material') return materialModal(payload);
  if(name==='mov') return movModal();
  if(name==='adjust') return adjustModal(payload);
  if(name==='global-search') return globalSearchModal();
  if(name==='edit-name') return editNameModal();
  if(name==='confirm-reset') return confirmModal('Zerar todas as informações?','Isso removerá permanentemente todos os materiais, lotes e movimentações desta conta.','Zerar dados', resetAllData);
  if(name==='confirm-delete-mat') return confirmModal('Remover material?','Isso também apagará o histórico de movimentações deste item.','Remover', ()=>deleteMaterial(payload.id));
  if(name==='install-help') return installHelpModal();
  return '';
}

    </div>
  </div>`;
}

function globalSearchModal(){
  const q = S.ui.globalSearchQuery.toLowerCase();
  const results = q? S.data.materials.filter(m=> m.name.toLowerCase().includes(q) || (m.code||'').toLowerCase().includes(q)).slice(0,8) : [];
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" style="max-width:460px;">
      <h3>Pesquisar</h3>
      <p class="modal-sub">Busque um material pelo código ou pelo nome.</p>
      <input class="search-input" id="global-search-input" placeholder="Digite código ou nome…" value="${escapeHtml(S.ui.globalSearchQuery)}" style="margin-bottom:10px;">
      <div>
        ${!q? `<div class="gsr-empty">Comece a digitar para pesquisar.</div>` :
          results.length? results.map(m=>`<div class="gsr-item" data-goto="${m.id}"><div><span class="mat-name">${escapeHtml(m.name)}</span><div class="mat-meta">${escapeHtml(m.category)}</div></div><span class="mat-code">${escapeHtml(m.code||'—')}</span></div>`).join('') :
          `<div class="gsr-empty">Nenhum material encontrado.</div>`}
      </div>
      <div class="modal-actions"><button type="button" class="btn btn-outline" id="modal-cancel">Fechar</button></div>
    </div>
  </div>`;
}

function confirmModal(title, desc, cta, onConfirm){
  window._confirmAction = onConfirm;
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" style="max-width:400px;">
      <h3>${title}</h3>
      <p class="modal-sub">${desc}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline" id="modal-cancel">Cancelar</button>
        <button type="button" class="btn btn-danger-solid" id="modal-confirm">${cta}</button>
      </div>
    </div>
  </div>`;
}

function installHelpModal(){
  return `
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" style="max-width:420px;">
      <h3>Instalar a Olhatta</h3>
      <p class="modal-sub">Seu navegador não ofereceu a instalação automática agora. Você ainda pode instalar manualmente:</p>
      <p style="font-size:13.5px;line-height:1.7;">
        <strong>No celular (Android/Chrome):</strong> toque no menu ⋮ e escolha "Instalar app" ou "Adicionar à tela inicial".<br>
        <strong>No iPhone (Safari):</strong> toque em Compartilhar → "Adicionar à Tela de Início".<br>
        <strong>No computador (Chrome/Edge):</strong> clique no ícone de instalação na barra de endereço, ou no menu ⋮ → "Instalar Olhatta".
      </p>
      <div class="note-box">Este app já inclui manifest e service worker prontos. Assim que estiver publicado no GitHub Pages (endereço https), a maioria dos navegadores oferece a instalação automática — em alguns (como Safari/iPhone) o caminho continua sendo manual, como acima.</div>
      <div class="modal-actions"><button type="button" class="btn btn-primary" id="modal-cancel">Entendi</button></div>
    </div>
  </div>`;
}

/* ---------------- events ---------------- */
function attachShellEvents(){
  document.querySelectorAll('[data-route]').forEach(el=>{
    el.onclick = ()=>{ S.route = el.dataset.route; S.ui.expandedMat=null; S.ui.modal=null; render(); };
  });
  const lo = document.getElementById('logout-btn'); if(lo) lo.onclick = doLogout;

  const gsBtn = document.getElementById('global-search-btn');
  if(gsBtn) gsBtn.onclick = ()=>{ S.ui.globalSearchQuery=''; openModal('global-search'); };

  setSyncStatus(S.ui.syncStatus);

  if(PERIOD_ROUTES.includes(S.route)){
    document.querySelectorAll('[data-pgran]').forEach(b=> b.onclick=()=>{ S.ui.period.gran=b.dataset.pgran; render(); });
    document.querySelectorAll('[data-pnav]').forEach(b=> b.onclick=()=>{ shiftPeriod(b.dataset.pnav); render(); });
    const lbl = document.getElementById('period-label-btn');
    const dateInput = document.getElementById('period-date-input');
    if(lbl && dateInput){
      lbl.onclick = ()=>{ if(dateInput.showPicker){ dateInput.style.pointerEvents='auto'; dateInput.showPicker(); } else { dateInput.click(); } };
      dateInput.onchange = ()=>{ if(dateInput.value){ S.ui.period.refDate = dateInput.value; render(); } };
    }
  }

  if(S.route==='dashboard'){
    const qaE=document.getElementById('qa-entrada'), qaN=document.getElementById('qa-novo'), qaS=document.getElementById('qa-saida');
    if(qaE) qaE.onclick = ()=>{ S.ui.movType='entrada'; openModal('mov'); };
    if(qaN) qaN.onclick = ()=>openModal('material');
    if(qaS) qaS.onclick = ()=>{ S.ui.movType='saida'; openModal('mov'); };
  }

  if(S.route==='estoque'){
    document.getElementById('btn-new-material').onclick = ()=>openModal('material');
    const searchEl = document.getElementById('estoque-search');
    searchEl.oninput = (e)=>{ S.ui.estoqueSearch=e.target.value; render(); document.getElementById('estoque-search').focus(); const el=document.getElementById('estoque-search'); el.selectionStart=el.selectionEnd=e.target.value.length; };
    document.getElementById('estoque-cat').onchange = (e)=>{ S.ui.estoqueCat=e.target.value; render(); };
    document.querySelectorAll('[data-toggle]').forEach(el=>{
      el.onclick = ()=>{ const id=el.dataset.toggle; S.ui.expandedMat = S.ui.expandedMat===id? null: id; render(); };
    });
    document.querySelectorAll('[data-sort]').forEach(el=>{
      el.onclick = ()=>{
        const f = el.dataset.sort;
        if(S.ui.estoqueSort.field===f) S.ui.estoqueSort.dir = S.ui.estoqueSort.dir==='asc'?'desc':'asc';
        else S.ui.estoqueSort = {field:f, dir:'asc'};
        render();
      };
    });
    document.querySelectorAll('[data-edit]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openModal('material',{id:el.dataset.edit}); };
    });
    document.querySelectorAll('[data-adjust]').forEach(el=>{
      el.onclick = (e)=>{ e.stopPropagation(); openModal('adjust',{id:el.dataset.adjust}); };
    });
  }
  if(S.route==='movimentacoes'){
    document.getElementById('btn-new-mov').onclick = ()=>openModal('mov');
  }
  if(S.route==='config'){
    document.getElementById('cfg-logout').onclick = doLogout;
    document.getElementById('cfg-edit-name').onclick = ()=>openModal('edit-name');
    document.getElementById('cfg-install').onclick = handleInstallClick;
    document.getElementById('cfg-update').onclick = handleUpdateClick;
    document.getElementById('cfg-reset').onclick = ()=>openModal('confirm-reset');
    document.getElementById('add-cat-btn').onclick = async ()=>{
      const inp = document.getElementById('new-cat-input');
      await addCategory(inp.value); render();
    };
    document.querySelectorAll('[data-del-cat]').forEach(el=>{
      el.onclick = async ()=>{
        const c = el.dataset.delCat;
        S.data.categories = S.data.categories.filter(x=>x!==c);
        await saveUserData(); render();
      };
    });
  }

  attachModalEvents();
}

function attachModalEvents(){
  const overlay = document.getElementById('modal-overlay');
  if(!overlay) return;
  overlay.onclick = (e)=>{ if(e.target===overlay) closeModal(); };
  const cancel = document.getElementById('modal-cancel'); if(cancel) cancel.onclick = closeModal;
  const confirmBtn = document.getElementById('modal-confirm');
  if(confirmBtn) confirmBtn.onclick = ()=>{ if(window._confirmAction) window._confirmAction(); };

  const matForm = document.getElementById('material-form');
  if(matForm){
    matForm.onsubmit = (e)=>{ e.preventDefault(); saveMaterial(matForm, S.ui.modal.payload && S.ui.modal.payload.id); };
    const delBtn = document.getElementById('del-mat-btn');
    if(delBtn) delBtn.onclick = ()=> openModal('confirm-delete-mat', S.ui.modal.payload);
    const tracksToggle = document.getElementById('tracks-expiry-toggle');
    const initExpWrap = document.getElementById('initial-expiry-wrap');
    if(tracksToggle && initExpWrap){
      tracksToggle.onchange = ()=>{ initExpWrap.style.display = tracksToggle.checked? '' : 'none'; };
    }
  }

  const movForm = document.getElementById('mov-form');
  if(movForm){
    document.querySelectorAll('[data-movtype]').forEach(el=>{
      el.onclick = ()=>{ S.ui.movType = el.dataset.movtype; openModal('mov'); };
    });
    const matSelect = document.getElementById('mov-material-select');
    if(matSelect){
      matSelect.onchange = ()=>{
        const opt = matSelect.options[matSelect.selectedIndex];
        const tracks = opt && opt.dataset.tracks==='true';
        const wrap = document.getElementById('expiry-field-wrap');
        if(wrap) wrap.style.display = (S.ui.movType==='entrada' && tracks)? '' : 'none';
      };
    }
    movForm.onsubmit = async (e)=>{
      e.preventDefault();
      const materialId = movForm.materialId.value;
      const qty = movForm.qty.value;
      const note = movForm.note.value;
      let ok = true;
      if(S.ui.movType==='entrada') await registerEntrada(materialId, qty, movForm.expiry ? movForm.expiry.value : null, note);
      else ok = await registerSaida(materialId, qty, note, movForm.motivo ? movForm.motivo.value : 'Outro');
      if(ok!==false) closeModal();
    };
  }

  const adjustForm = document.getElementById('adjust-form');
  if(adjustForm){
    adjustForm.onsubmit = async (e)=>{
      e.preventDefault();
      await registerAjuste(S.ui.modal.payload.id, adjustForm.newQty.value, adjustForm.note.value);
      closeModal();
    };
  }

  const editNameForm = document.getElementById('edit-name-form');
  if(editNameForm){
    editNameForm.onsubmit = async (e)=>{ e.preventDefault(); await saveDisplayName(editNameForm.displayName.value); closeModal(); };
  }

  const gsInput = document.getElementById('global-search-input');
  if(gsInput){
    gsInput.focus();
    gsInput.selectionStart = gsInput.selectionEnd = gsInput.value.length;
    gsInput.oninput = (e)=>{ S.ui.globalSearchQuery = e.target.value; render(); };
    document.querySelectorAll('[data-goto]').forEach(el=>{
      el.onclick = ()=>{
        const mat = findMaterial(el.dataset.goto);
        S.route='estoque'; S.ui.estoqueSearch = mat? (mat.code||mat.name) : ''; S.ui.modal=null;
        render();
      };
    });
  }
}

document.addEventListener('keydown', (e)=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    if(S.session && S.dataLoaded){ e.preventDefault(); S.ui.globalSearchQuery=''; openModal('global-search'); }
  }
});

/* ---------------- service worker (instalação como app) ---------------- */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------------- boot ---------------- */
S.authResolved = false;
S.dataLoaded = false;

function boot(){
  if(!FIREBASE_READY){ render(); return; }
  auth.onAuthStateChanged((user)=>{
    S.authResolved = true;
    if(user){
      S.session = {uid:user.uid, email:user.email, displayName:user.displayName||''};
      S.needsName = !user.displayName;
      S.dataLoaded = false;
      subscribeUserData(user.uid);
    } else {
      if(unsubscribeDoc){ unsubscribeDoc(); unsubscribeDoc=null; }
      S.session = null; S.data = null; S.dataLoaded=false; S.needsName=false;
    }
    render();
  });
  render();
}
boot();
</script>
